# electron-builder only produces the unpacked application tree; the flatpak
# manifest is what actually packages RomMix. `--linux dir` gives us
# dist/linux-unpacked/, which flatpak-builder copies into /app.
appId: be.bl_it.RomMix
productName: RomMix
executableName: rommix

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# RomMix ships no native modules, so there is nothing to rebuild per-arch.
npmRebuild: false

linux:
  target:
    - dir
  category: Game
  executableName: rommix
