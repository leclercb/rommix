# Flatpak manifest for RomMix.
#
# This packages a *prebuilt* Electron application tree (dist/linux-unpacked,
# produced by `npm run pack:dir`). Building npm dependencies inside
# flatpak-builder would require vendoring every package as an offline source —
# worth doing for a Flathub submission, unnecessary for a personal build.
# See README.md for how to move to a fully offline build if you ever publish.
id: be.bl_it.RomMix
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

# Supplies the shared Electron dependencies and the zypak launcher, which lets
# Chromium's sandbox work inside a flatpak.
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'

command: rommix
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

  # Chromium picks its Ozone backend during early start-up, before any of our
  # JavaScript runs, so `app.commandLine.appendSwitch` in the main process comes
  # too late to be believed. Without this it takes X11, finds no server on a
  # Wayland-only session, and exits with "The platform failed to initialize"
  # despite the Wayland socket being right there. The environment variable is
  # the one Electron documents for exactly this.
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --socket=pulseaudio
  - --device=dri

  # Controllers. Chromium's Gamepad API reads /dev/input/event*, so without
  # device access the entire UI becomes keyboard-only.
  - --device=all

  # RomMix's own folder (~/rommix by default, relocatable), the ROM tree, and
  # each emulator's save directory all live under the real home — and a
  # RetroDECK library is frequently on an SD card, so the removable-media mount
  # point is needed too. Emulators RomMix downloads are written here and then
  # executed on the host, so they must be on a path the host can see.
  - --filesystem=home
  - --filesystem=/run/media:rw
  - --filesystem=xdg-run/gamescope-0:ro

  # Emulators are started on the host: some are flatpaks (RetroDECK,
  # RetroArch), which cannot be nested inside ours, and some are AppImages that
  # need the host's FUSE and loader. Both go through flatpak-spawn.
  # This is a broad permission: anything RomMix can spawn on the host runs
  # unsandboxed. It is the only way to start another flatpak from inside one.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: rommix
    buildsystem: simple
    build-commands:
      # The application tree itself.
      - mkdir -p /app/rommix
      - cp -a linux-unpacked/. /app/rommix/

      # zypak-wrapper hands Chromium a sandbox it can actually use under flatpak.
      - install -Dm755 rommix.sh /app/bin/rommix

      - install -Dm644 be.bl_it.RomMix.desktop /app/share/applications/be.bl_it.RomMix.desktop
      - install -Dm644 be.bl_it.RomMix.metainfo.xml
        /app/share/metainfo/be.bl_it.RomMix.metainfo.xml
      - install -Dm644 be.bl_it.RomMix.svg
        /app/share/icons/hicolor/scalable/apps/be.bl_it.RomMix.svg

    sources:
      - type: dir
        path: ../dist
        dest: .

      - type: file
        path: be.bl_it.RomMix.desktop

      - type: file
        path: be.bl_it.RomMix.metainfo.xml

      - type: file
        path: be.bl_it.RomMix.svg

      - type: script
        dest-filename: rommix.sh
        commands:
          # The hint is passed here as well as through ELECTRON_OZONE_PLATFORM_HINT
          # so that a launcher which drops the environment still starts on
          # Wayland. Both are harmless together, and `auto` falls back to X11
          # wherever that is what the session offers.
          - exec zypak-wrapper /app/rommix/rommix --ozone-platform-hint=auto "$@"
