# Publishes the site — the landing page plus the browser demo — to GitHub Pages.
#
# The build is `scripts/build-site.sh`, exactly as it runs locally, so what lands
# on the site is what `npm run build:site` produces here. Nothing in it is part of
# the application: the demo is the renderer with the stub bridge from
# `src/renderer/src/dev/` behind it, which is never in a shipped bundle.
#
# Pages has to be enabled once by hand, in Settings -> Pages, with Source set to
# GitHub Actions. There is no way around it from here: the action that can create
# the site refuses to do it with the workflow's own GITHUB_TOKEN and wants a
# personal access token, which is a secret to manage and rotate in exchange for
# saving one click. Until it is enabled, `deploy-pages` below fails.
name: Pages

on:
  push:
    branches:
      - main
    paths:
      # The demo is built from the renderer, so a change to the front end
      # changes the site too.
      - 'site/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'src/config/**'
      - 'vite.web.config.ts'
      - 'scripts/build-site.sh'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancelled halfway: an interrupted publish
# leaves the live site mid-swap, which is worse than a queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:site

      # No `configure-pages` step: its job is to hand a static site generator the
      # URL the site will be served from, and `vite.web.config.ts` builds with a
      # relative base precisely so that nothing has to be told. Deploying reads
      # the Pages settings for itself.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
