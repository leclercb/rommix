# Builds the AppImage on every push and pull request, and turns a `v*` tag into
# a GitHub release with the image attached.
#
# One stage now that RomMix is not packaged as a flatpak: electron-builder takes
# the bundle electron-vite produced and writes a single self-contained file.
# There is no runtime to install, no remote to add, and nothing for the release
# page to explain beyond "make it executable and run it".
name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # One leg per architecture, each on a runner of that architecture:
    # electron-builder packages the Electron binary for the machine it is told
    # to target, and cross-packaging an AppImage means fetching a foreign
    # Electron and an emulated FUSE runtime for no gain when GitHub hosts both.
    # `arm64` is what a Linux handheld that is not x86 actually runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, not the 20/22 the README asks of a user: `npm test` runs the
          # TypeScript tests through node's own type stripping.
          node-version: 24
          cache: npm

      - name: Read the version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag names a version in three places, and only one of them is the tag.
      # Catching a mismatch here costs seconds; catching it after publishing
      # means deleting a release. The changelog entry matters as much as
      # package.json: a release missing from it is a release nobody can read
      # about.
      - name: Check the tag against package.json and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version='${{ steps.meta.outputs.version }}'
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! grep -qE "^## $version( |$)" CHANGELOG.md; then
            echo "::error::no '## $version' section in CHANGELOG.md"
            exit 1
          fi

      - run: npm ci

      # The same gates `.release-it.js` runs before it will cut a tag, repeated
      # here because a pull request never goes through release-it.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # `npm run appimage` is these two together; they are split so that a
      # failing bundle and a failing package are separate red steps. The
      # `--publish never` that matters lives in the `package` script, so it
      # cannot be forgotten here — see package.json.
      - run: npm run build
      - run: npm run package -- --${{ matrix.arch }}

      # Shipped beside the image, not inside it: it is what Steam's shortcut
      # points at, and the AppImage cannot set the variable that makes itself
      # launchable from Steam. See packaging/rommix-steam.sh.
      - run: cp packaging/rommix-steam.sh dist/

      # Named per leg: two jobs uploading one name is an error, and the release
      # job merges them back with a pattern.
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/rommix-steam.sh
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # Both legs into one folder. `rommix-steam.sh` is identical in each, and
      # `merge-multiple` overwrites rather than nesting, so it lands once.
      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      # The two file names, from the tag. Derived here rather than passed out of
      # the build job: a matrix writes one `outputs` key per leg and the last to
      # finish wins, so an `image` output would name whichever architecture
      # happened to be slower. `electron-builder.yml` spells the suffixes —
      # `${arch}` is `x86_64` and `arm64`.
      - name: Name the images
        id: names
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "x86=RomMix-$version-x86_64.AppImage" >> "$GITHUB_OUTPUT"
          echo "arm=RomMix-$version-arm64.AppImage" >> "$GITHUB_OUTPUT"

      # generate_release_notes has GitHub write the changelog from the commits
      # and pull requests since the last tag; `body` is prepended to it, which is
      # where the part a release page actually needs — how to run the thing —
      # goes. A tag like v0.2.0-rc1 is a pre-release; v0.2.0 is not.
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/rommix-steam.sh
          name: RomMix ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            ### Run

            `${{ steps.names.outputs.x86 }}` for an ordinary PC or a Steam Deck,
            `${{ steps.names.outputs.arm }}` for an ARM handheld or single-board
            machine. `uname -m` says which you are on: `x86_64` or `aarch64`.

            ```bash
            chmod +x ${{ steps.names.outputs.x86 }}
            ./${{ steps.names.outputs.x86 }}
            ```

            ### From Steam

            Download `rommix-steam.sh` as well, keep it beside the AppImage, and
            add **the script** as the non-Steam game:

            ```bash
            chmod +x ${{ steps.names.outputs.x86 }} rommix-steam.sh
            ```

            Steam launches a game with `PR_SET_NO_NEW_PRIVS`, under which the
            kernel ignores the setuid bit — so `fusermount` cannot mount and an
            AppImage started directly by Steam never unpacks itself. The script
            unpacks it instead. It still `exec`s the image, so RomMix stays the
            emulator's parent process, which is what lets Steam manage the
            window the emulator opens.
