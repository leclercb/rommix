<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rommix</title>
    <!--
      No remote origins: the renderer only ever loads its own bundle and images
      from the custom rommix-img: protocol, which the main process authenticates.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' rommix-img: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
